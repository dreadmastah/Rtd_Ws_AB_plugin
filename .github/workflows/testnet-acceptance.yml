name: Binance Demo Trading Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight performs no order; order submits one bounded Demo Trading MARKET order"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - order
      rest_base_url:
        description: "Allowed by harness only if Binance Demo Trading HTTPS host"
        required: true
        default: "https://testnet.binancefuture.com"
        type: string
      symbol:
        description: "USD-M Demo Trading symbol"
        required: true
        default: "BTCUSDT"
        type: string
      side:
        description: "MARKET order side for order mode"
        required: true
        default: BUY
        type: choice
        options:
          - BUY
          - SELL
      quantity:
        description: "Explicit quantity for order mode; ignored by preflight"
        required: true
        default: "0"
        type: string
      max_test_notional:
        description: "Acceptance cap in quote units; harness hard ceiling is 50"
        required: true
        default: "25"
        type: string
      confirmation:
        description: "For order mode type exactly EXECUTE_DEMO_ORDER"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: binance-demo-trading-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: binance-demo-trading
    env:
      ASTU_BINANCE_TESTNET_API_KEY: ${{ secrets.ASTU_BINANCE_TESTNET_API_KEY }}
      ASTU_BINANCE_TESTNET_API_SECRET: ${{ secrets.ASTU_BINANCE_TESTNET_API_SECRET }}
      ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE: ${{ secrets.ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow inputs
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$ASTU_BINANCE_TESTNET_API_KEY"
          test -n "$ASTU_BINANCE_TESTNET_API_SECRET"
          test -n "$ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE"

          if [ "$MODE" = "order" ] && [ "$CONFIRMATION" != "EXECUTE_DEMO_ORDER" ]; then
            echo "ORDER_ACCEPTANCE_REFUSED=confirmation_mismatch"
            exit 2
          fi

      - name: Compile acceptance harness
        run: |
          python -m py_compile Core/tools/testnet_acceptance.py
          python -m py_compile Core/account/binance_usdm_testnet_user_data.py
          python Core/tests/test_testnet_acceptance_guard.py

      - name: Credentialed Demo Trading preflight
        if: ${{ inputs.mode == 'preflight' }}
        shell: bash
        run: |
          python Core/tools/testnet_acceptance.py             --rest-base-url "${{ inputs.rest_base_url }}"             --ws-url-template "$ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE"             --symbol "${{ inputs.symbol }}"             --side "${{ inputs.side }}"             --max-test-notional "${{ inputs.max_test_notional }}"

      - name: Credentialed bounded Demo Trading MARKET acceptance
        if: ${{ inputs.mode == 'order' }}
        shell: bash
        env:
          ASTU_TESTNET_ACCEPTANCE_ARM: I_UNDERSTAND_TESTNET_ORDER
        run: |
          python Core/tools/testnet_acceptance.py             --execute-market-order             --rest-base-url "${{ inputs.rest_base_url }}"             --ws-url-template "$ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE"             --symbol "${{ inputs.symbol }}"             --side "${{ inputs.side }}"             --quantity "${{ inputs.quantity }}"             --max-test-notional "${{ inputs.max_test_notional }}"

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-demo-trading-acceptance-report
          path: Core/runtime/testnet_acceptance_report.v1.json
          if-no-files-found: warn
          retention-days: 14
