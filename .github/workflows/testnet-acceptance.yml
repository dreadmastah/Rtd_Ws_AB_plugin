name: Binance Demo Trading Acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight performs no order; order submits one bounded Demo Trading MARKET order"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - order
      rest_base_url:
        description: "Allowed by harness only if Binance Demo Trading HTTPS host"
        required: true
        default: "https://demo-fapi.binance.com"
        type: string
      symbol:
        description: "USD-M Demo Trading symbol"
        required: true
        default: "BTCUSDT"
        type: string
      side:
        description: "MARKET order side for order mode"
        required: true
        default: BUY
        type: choice
        options:
          - BUY
          - SELL
      quantity:
        description: "Explicit quantity for order mode; ignored by preflight"
        required: true
        default: "0"
        type: string
      max_test_notional:
        description: "Acceptance cap in quote units; harness hard ceiling is 100"
        required: true
        default: "100"
        type: string
      confirmation:
        description: "For order mode type exactly EXECUTE_DEMO_ORDER"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: binance-demo-trading-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    environment: binance-demo-trading
    env:
      ASTU_BINANCE_TESTNET_API_KEY: ${{ secrets.ASTU_BINANCE_TESTNET_API_KEY }}
      ASTU_BINANCE_TESTNET_API_SECRET: ${{ secrets.ASTU_BINANCE_TESTNET_API_SECRET }}
      ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE: ${{ vars.ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE }}

    steps:
      - name: Checkout acceptance implementation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/core-autotrader-scaffold-sim-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workflow inputs
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ASTU_BINANCE_TESTNET_API_KEY)) { throw "missing API key" }
          if ([string]::IsNullOrWhiteSpace($env:ASTU_BINANCE_TESTNET_API_SECRET)) { throw "missing API secret" }
          if ([string]::IsNullOrWhiteSpace($env:ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE)) { throw "missing Demo stream URL" }

          if ($env:MODE -eq "order" -and $env:CONFIRMATION -ne "EXECUTE_DEMO_ORDER") {
            Write-Host "ORDER_ACCEPTANCE_REFUSED=confirmation_mismatch"
            exit 2
          }

      - name: Compile acceptance harness
        run: |
          python -m py_compile Core/tools/testnet_acceptance.py
          python -m py_compile Core/account/binance_usdm_testnet_user_data.py
          python Core/tests/test_testnet_acceptance_guard.py

      - name: Credentialed Demo Trading preflight
        if: ${{ inputs.mode == 'preflight' }}
        shell: pwsh
        run: |
          python Core/tools/testnet_acceptance.py `
            --rest-base-url "${{ inputs.rest_base_url }}" `
            --ws-url-template "$env:ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE" `
            --symbol "${{ inputs.symbol }}" `
            --side "${{ inputs.side }}" `
            --max-test-notional "${{ inputs.max_test_notional }}"

      - name: Credentialed bounded Demo Trading MARKET acceptance
        if: ${{ inputs.mode == 'order' }}
        shell: pwsh
        env:
          ASTU_TESTNET_ACCEPTANCE_ARM: I_UNDERSTAND_TESTNET_ORDER
        run: |
          python Core/tools/testnet_acceptance.py `
            --execute-market-order `
            --rest-base-url "${{ inputs.rest_base_url }}" `
            --ws-url-template "$env:ASTU_BINANCE_TESTNET_USER_STREAM_URL_TEMPLATE" `
            --symbol "${{ inputs.symbol }}" `
            --side "${{ inputs.side }}" `
            --quantity "${{ inputs.quantity }}" `
            --max-test-notional "${{ inputs.max_test_notional }}"

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-demo-trading-acceptance-report
          path: Core/runtime/testnet_acceptance_report.v1.json
          if-no-files-found: warn
          retention-days: 14
